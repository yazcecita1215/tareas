<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E19"/>
      <stop offset="50%" stop-color="#101714"/>
      <stop offset="100%" stop-color="#0B100E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23322B"/>
      <stop offset="100%" stop-color="#1B2620"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EEDB6"/>
      <stop offset="100%" stop-color="#35C878"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#35C878" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#35C878" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Inner Badge / Checklist Base -->
  <rect x="88" y="88" width="336" height="336" rx="48" fill="url(#cardGrad)" stroke="#2B3D33" stroke-width="3"/>

  <!-- Checklist lines -->
  <rect x="208" y="152" width="168" height="20" rx="10" fill="#F5F7F5" fill-opacity="0.95"/>
  <rect x="208" y="246" width="140" height="20" rx="10" fill="#B6C1BA" fill-opacity="0.8"/>
  <rect x="208" y="340" width="100" height="20" rx="10" fill="#B6C1BA" fill-opacity="0.5"/>

  <!-- Radio/Check bullets -->
  <circle cx="152" cy="162" r="22" fill="#35C878" filter="url(#glow)"/>
  <path d="M143 162 L149 168 L162 155" fill="none" stroke="#101714" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="152" cy="256" r="22" fill="#18231D" stroke="#35C878" stroke-width="3"/>
  <circle cx="152" cy="350" r="22" fill="#18231D" stroke="#3A4D43" stroke-width="3"/>

  <!-- Accent star spark in top right -->
  <circle cx="396" cy="116" r="6" fill="#35C878" opacity="0.8"/>
  <circle cx="376" cy="96" r="3" fill="#4EEDB6" opacity="0.6"/>
</svg>
